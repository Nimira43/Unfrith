<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/TheFavicon.png" />
    <title>Unfriþ</title>
  </head>
  <body>
    <div id="stage">
      <div id="frame">
        <div id="viewport">
          <canvas
            id="game"
            width="1280"
            height="640"
            aria-label="Unfriþ"
          ></canvas>
          <div id="board" class="board" hidden></div>
          <div id="modal" class="modal" hidden>
            <div
              class="modal__panel"
              role="dialog"
              aria-modal="true"
              aria-labelledby="modal-title"
            >
              <h2 id="modal-title" class="modal__title"></h2>
              <div id="modal-body" class="modal__body"></div>
              <button id="modal-close" class="btn btn--primary" type="button">
                Close
              </button>
            </div>
          </div>
        </div>

        <footer id="taskbar" class="is-title">
          <div class="taskbar__left">
            <div class="taskbar__game">
              <span id="tb-alert" class="alert alert--unseen"
                ><i></i><b>UNSEEN</b></span
              >
              <span class="taskbar__stat"
                ><span class="taskbar__label">Evidence</span>
                <span id="tb-evidence" class="taskbar__data">0/3</span></span
              >
              <span class="taskbar__stat"
                ><span class="taskbar__label">Stones</span>
                <span id="tb-stones" class="taskbar__data">2/5</span></span
              >
            </div>
            <div class="taskbar__titleonly">
              <span class="taskbar__label">Status</span>
              <span id="tb-status" class="taskbar__data">AWAITING ORDERS</span>
            </div>
          </div>

          <div class="taskbar__centre">
            <span id="tb-ticker" class="taskbar__ticker"
              >Obedience · Work · Worship</span
            >
          </div>

          <div class="taskbar__right">
            <div class="taskbar__game">
              <span id="tb-bell-wrap" class="taskbar__stat"
                ><span class="taskbar__label">Bell</span>
                <span id="tb-bell" class="taskbar__data">0:22</span></span
              >
              <button class="btn" type="button" data-action="evidence">
                Evidence
              </button>
              <button
                class="btn"
                type="button"
                data-action="fracture"
                disabled
                title="The board waits at the base"
              >
                Fracture
              </button>
              <button class="btn" type="button" data-action="objectives">
                Objectives
              </button>
              <button class="btn" type="button" data-action="pause">
                Pause
              </button>
            </div>
            <div class="taskbar__titleonly">
              <span class="taskbar__data">v0.3.0</span>
            </div>
          </div>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
